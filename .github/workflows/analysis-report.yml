name: 분석 리포트 발송

# 매매 결과·설정·검증 결과를 한 덩어리로 모아 텔레그램으로 보낸다.
# 받은 내용을 그대로 복사해 Claude에게 붙여넣으면 전략 진단을 받을 수 있다.
#
# 매일 보내면 알림 피로가 쌓이고 하루치 표본으로는 판단할 것도 없어서,
# 주 1회(금요일 장마감 후)로 잡았다.

on:
  schedule:
    - cron: "0 8 * * 5" # 금요일 08:00 UTC = 17:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: "집계 기간(일)"
        default: "30"

jobs:
  report:
    # ── 예약은 운영 저장소에서만 돈다 ──────────────────────────
    # 이 코드는 두 저장소(muwon406·sdlab_trading)에 똑같이 들어 있다.
    # 양쪽에서 예약이 울리면 같은 일이 하루에 두 번 돌고, push-records는
    # 시트에 같은 줄을 두 번 쌓는다.
    #
    # n8n 시계가 아직 muwon406을 부르므로 그쪽이 운영이다. n8n을 옮기는
    # 날 이 이름을 sdlab_trading으로 바꾼다. **양쪽 저장소에서 같이.**
    # 손으로 부르는 것(workflow_dispatch)은 어느 쪽에서든 그대로 된다.
    if: github.event_name != 'schedule' || github.repository == 'uTaxx/muwon406'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      # 읽기 전용이라 상태 DB를 다시 올리지 않는다. 리포트 생성이 운영
      # 상태를 건드릴 이유가 없고, 올리면 다른 실행과 덮어쓰기 경합만 생긴다.
      - name: 리포트 생성·발송
        run: |
          python scripts/run_analysis_report.py --days "${{ github.event.inputs.days || '30' }}"

      # 백테스트의 슬리피지 값을 추측이 아니라 실측으로 정하기 위한 집계.
      # 주문이 쌓여야 뜻이 생기므로 주간 리포트와 같이 돌린다.
      - name: 결정가 대비 체결가 집계
        run: python scripts/measure_execution_cost.py
