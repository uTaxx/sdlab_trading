name: 증권사 보유 종목 들이기

# 증권사 계좌에는 있는데 우리 DB엔 없는 종목을 우리 기록으로 들인다.
# 엔진은 자기가 모르는 종목을 팔지 않으므로, 들이기 전까지 그 주식에는
# 손절이 안 걸린다.
#
# 기본은 미리보기다. apply를 true로 줘야 실제로 쓴다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 DB에 쓸지 (false면 미리보기만)"
        type: choice
        options: ["false", "true"]
        default: "false"
      entry_date:
        description: "매수일 YYYY-MM-DD (비우면 오늘). 보유일수 청산이 이 날부터 센다"
        default: ""
      fix_quantity:
        description: "수량을 계좌 값으로 덮을 종목 (쉼표로 여럿). 원인을 확인한 뒤에만 — 부분 체결·손매매·버그가 겉이 같다"
        default: ""

concurrency:
  # 상태 DB를 고치는 워크플로는 전부 이 그룹이다. DB가 구글드라이브의 파일
  # 하나라, 두 실행이 겹치면 나중 것이 앞 것을 통째로 덮는다. 장중 손절
  # 감시(watch-stops)가 5분마다 도는 뒤로 특히 그렇다.
  group: state-write
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 들이기
        run: |
          # `| tee` 없이도 습관으로 켠다 — 나중에 누가 파이프를 붙여도
          # 파이썬이 죽은 것을 초록불이 덮지 않게.
          set -o pipefail
          fixargs=""
          for s in $(echo "${{ github.event.inputs.fix_quantity }}" | tr ',' ' '); do
            fixargs="$fixargs --fix-quantity $s"
          done
          python scripts/adopt_holdings.py $fixargs \
            ${{ github.event.inputs.apply == 'true' && '--apply' || '' }} \
            ${{ github.event.inputs.entry_date != '' && format('--entry-date {0}', github.event.inputs.entry_date) || '' }}

      # 미리보기였다면 DB가 안 바뀌었으니 올려도 같은 파일이다. 그래도
      # 조건을 걸어 둔다 — 쓰지 않은 실행이 운영 파일을 건드릴 이유가 없다.
      - name: 상태 DB 올리기
        if: github.event.inputs.apply == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db
