name: 측정 결과 DB에 쌓기

# 보유 상한별 측정이 남긴 결과 파일을 상태 DB에 넣는다.
# 설계안은 docs/단기매매_재설계.md §14다.
#
# ## 왜 재는 것과 따로 두나
#
# 측정은 30분에서 한 시간 걸린다. 상태 DB는 구글드라이브의 파일 하나라
# 고치는 워크플로를 전부 state-write로 묶어 겹치지 않게 한다. 측정을 그
# 자물쇠 안에서 돌리면 한 시간 동안 장중 손절 감시와 매수 후보 산출이
# 전부 기다린다.
#
# 그래서 재는 쪽은 자물쇠 없이 오래 돌며 파일만 남기고, 이 워크플로가
# 그 파일을 몇 초 만에 넣는다. 자물쇠는 이쪽만 잡는다.
#
# ## 주문은 나가지 않는다
#
# 이미 계산된 값을 옮겨 적을 뿐이다. 다만 상태 DB를 고치므로 자물쇠가
# 필요하다.
#
# ## 식별자는 영문으로 둔다
#
# GitHub Actions 표현식 파서가 한글 식별자를 못 읽는다.

on:
  # 측정이 끝나면 저절로 이어 돈다. 사람이 실행 번호를 옮겨 적지 않는다.
  #
  # **재는 것과 쌓는 것을 따로 둔 채로 잇는다.** 한 워크플로로 합치면
  # 오래 걸리는 계산이 state-write 자물쇠를 통째로 잡아, 그동안 장중
  # 손절 감시와 매수 후보 산출이 전부 기다린다.
  workflow_run:
    workflows: ["보유 상한별 측정"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "결과를 가져올 '보유 상한별 측정' 실행 번호"
        required: true
      dry_run:
        description: "true면 DB를 고치지 않고 무엇이 들어갈지만 출력합니다"
        type: boolean
        default: false

concurrency:
  # 상태 DB가 드라이브의 파일 하나라 겹치면 나중 것이 앞 것을 통째로 덮는다.
  group: state-write
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 측정이 실패했으면 쌓지 않는다. 반쯤 나온 결과를 넣으면 그것을 진짜
    # 측정으로 읽는다.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    # 화면이 읽을 자료를 만들어 이 가지에 커밋한다. 줄이 천 개가 넘어서
    # 사람이 손으로 옮겨 적을 수 없다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 기본 설정은 얕은 복제라 커밋을 밀어 넣을 수 없다.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      # 손으로 실행하면 입력으로, 측정이 이어 부르면 그 실행 번호로.
      - name: 어느 실행을 쌓나
        id: pick
        env:
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
          FROM_SCAN: ${{ github.event.workflow_run.id }}
        run: |
          # 셸 변수 이름에 한글을 쓰면 bash가 command not found로 죽는다.
          RUN_ID="${IN_RUN_ID:-$FROM_SCAN}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::쌓을 측정 실행 번호가 없습니다."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "측정 실행 $RUN_ID 를 쌓습니다."

      - name: 측정 결과 내려받기
        uses: actions/download-artifact@v4
        with:
          name: window-scan
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "$GDRIVE_FOLDER_ID" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        env:
          MASTER_KEY: ${{ secrets.MUWON_MASTER_KEY }}
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=$MASTER_KEY" >> .env

      # 입력값을 run: 안에 그대로 넣지 않는다. 셸 글자 안으로 치환돼서
      # $(...)가 섞인 값이 명령으로 실행된다. env로 넘기고 따옴표로 감싼다.
      - name: DB에 쌓기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          MUWON_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # 셸 변수 이름에 한글을 쓰면 bash가 command not found로 죽는다.
          ARGS=""
          if [ "$MUWON_DRY_RUN" = "true" ]; then
            ARGS="--미리보기"
          fi
          python scripts/store_window_scan.py --파일 window-scan.json --표찍기 $ARGS

      # workflow_run으로 이어 돌면 dry_run 입력이 비어 있다. 빈 값은
      # 'true'가 아니므로 아래 조건이 그대로 참이 되어 실제로 쌓는다.
      #
      # 화면은 정적 파일이라 DB를 못 읽는다. 시트를 거치는 길도 있지만
      # 이 자료는 줄이 천 개가 넘어서 시트에 맞지 않는다.
      #
      # 쌓기가 실패했으면 뽑지 않는다. 반쯤 들어간 DB로 만든 파일이
      # 화면에 뜨면 그것을 진짜 측정으로 읽는다.
      - name: 화면 자료 뽑기
        if: success() && github.event.inputs.dry_run != 'true'
        run: python scripts/export_window_data.py

      - name: 화면 자료 커밋
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          IN_RUN_ID: ${{ steps.pick.outputs.run_id }}
        run: |
          # 셸 변수 이름에 한글을 쓰면 bash가 command not found로 죽는다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/자료/상한측정.json
          # 안 바뀌었으면 빈 커밋을 남기지 않는다. 빈 커밋이 쌓이면
          # 기록에서 실제로 자료가 바뀐 날을 찾을 수 없다.
          if git diff --cached --quiet; then
            echo "화면 자료가 그대로입니다. 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "상한별 측정 결과를 화면 자료로 뽑습니다 (실행 $IN_RUN_ID)"
          # 측정이 이어 부른 실행은 그 사이 사람이 밀어 넣은 커밋과 부딪힐
          # 수 있다. 한 번 당겨 얹고 다시 민다. 그래도 안 되면 실패로 둔다.
          git push origin HEAD:"$GITHUB_REF_NAME" \
            || (git pull --rebase origin "$GITHUB_REF_NAME" \
                && git push origin HEAD:"$GITHUB_REF_NAME")

      # 쌓기가 실패했으면 올리지 않는다. 반쯤 들어간 DB를 올리면 다음
      # 실행이 그 상태를 정상으로 읽는다.
      - name: 상태 DB 구글드라이브에 올리기
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      # **실패했으면 반드시 알린다.** GitHub 화면의 빨간불을 매일 보는
      # 사람이 없으면 빨간불은 없는 것과 같다. 2026-09-04에 08:30 후보
      # 산출이 죽었는데 주인은 다음 날까지 모르셨다.
      - name: 실패했으면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          what: "상한별 측정 결과 쌓기"
          extra: "계산은 끝났는데 결과가 저장되지 않았을 수 있습니다."
