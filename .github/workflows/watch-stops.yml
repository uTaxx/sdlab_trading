name: 장중 손절 감시

# 장이 열려 있는 동안 손절선을 지켜본다.
#
# ## 왜 필요한가
#
# 하루 한 번 도는 엔진은 09:05에만 값을 본다. 그 뒤로 다음 날 09:05까지는
# 아무도 안 본다. 그 사이에 크게 빠져도 그날은 아무 일도 안 일어나고,
# 다음 날 아침에야 팔린다.
#
# ## 손절만 본다
#
# 사는 판단은 여기서 안 한다. "거래량이 20일 평균의 2배" 같은 조건은
# 하루치 거래량을 다 세야 성립하는데 장중에는 그 값이 아직 안 찼다.
# 보유 기간 만료와 전략 매도 신호도 완성된 일봉을 보는 것이라 09:05 몫이다.
#
# ## 누가 부르나
#
# n8n 시계가 장중에 5~10분마다 부른다. GitHub의 schedule은 몇십 분씩
# 늦게 도는 일이 있어 손절 감시에는 못 쓴다.
#
#   POST .../watch-stops.yml/dispatches   { dry_run: "false" }
#
# ## 상태 DB를 고치는 자리다
#
# 팔면 보유를 지우고 매매를 기록한다. 같은 DB를 고치는 다른 실행과 겹치면
# 나중 것이 앞 것을 덮으므로, DB를 쓰는 워크플로 전부와 같은 concurrency
# 그룹(state-write)에 묶어 두었다.
#
# 그리고 **아무것도 안 팔았으면 DB를 안 올린다.** 하루에 수십 번 도는
# 자리라, 안 바뀐 DB를 매번 올리면 그 사이 다른 실행이 쓴 것을 옛 것으로
# 덮을 수 있다. 스크립트가 실제로 고쳤을 때만 표시 파일을 남긴다.
#
# ## 모의투자 전용이다
#
# 스크립트가 kis.env == "real"이면 스스로 종료한다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 팔지 않고 판단만 보여 준다"
        default: "false"

concurrency:
  # 상태 DB를 고치는 일이라 겹치면 나중 것이 앞 것을 덮는다.
  group: state-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      # ATR 손절이나 트레일링을 켜 뒀을 때만 일봉을 받는다. 캐시가 있으면
      # 하루에 한 번만 받고 나머지 회차는 그대로 쓴다.
      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-watch-stops-${{ github.run_id }}
          restore-keys: |
            prices-watch-stops-

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 손절선 점검
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다. 조용히 성공한 척하는
          # 실패가 이 저장소에서 제일 비싼 종류다.
          set -o pipefail
          python scripts/watch_stops.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --changed-flag db-changed \
            | tee watch-stops.txt

      # 판 것이 있을 때만 올린다. 안 바뀐 DB를 올리면 그 사이 다른 실행이
      # 쓴 것을 옛 것으로 덮을 수 있다.
      - name: 상태 DB 올리기 (판 것이 있을 때만)
        if: hashFiles('db-changed') != ''
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      # 하루에 수십 번 도는 자리라 아티팩트를 매번 올리면 쌓이기만 한다.
      # 판 것이 있는 회차만 남긴다.
      - name: 결과 아티팩트로 올리기 (판 것이 있을 때만)
        if: hashFiles('db-changed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: watch-stops-${{ github.run_number }}
          path: watch-stops.txt
          retention-days: 30

      # **실패했으면 반드시 알린다.** GitHub 화면의 빨간불을 매일 보는
      # 사람이 없으면 빨간불은 없는 것과 같다. 2026-09-04에 08:30 후보
      # 산출이 죽었는데 주인은 다음 날까지 모르셨다.
      - name: 실패했으면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          what: "장중 손절 감시"
          extra: "이 회차의 손절·익절 확인이 건너뛰어졌습니다."
