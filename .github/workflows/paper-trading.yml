name: KIS 모의투자 일일 자동매매

# 평일 개장 직후(09:05 KST = 00:05 UTC) 자동 실행.
#
# 원래는 장마감 시각(15:30 KST)에 돌렸는데, 그때 주문을 넣으면 장이 이미
# 닫혀 KIS가 거부한다("장시간이 아닙니다"). 게다가 GitHub 스케줄러는 몇십 분씩
# 늦기 일쑤라 실제로는 16시 넘어 도는 날도 있었다. 신호가 떠도 체결될 수
# 없는 시간에 도는 셈이었다.
#
# 전략이 일봉 기준이라 판단에는 '완성된' 일봉이 필요하다. 그래서 개장 직후에
# 돌리되 엔진이 오늘 봉(아직 미완성)은 빼고 어제까지의 확정된 일봉으로
# 판단한 뒤, 오늘 시장가로 주문을 넣는다. 일봉 전략의 정석 순서다.
#
# GitHub Actions 러너는 매번 새 가상머신이라 로컬 디스크가 안 남으므로, 보유
# 종목·가상현금 상태(muwon.db)를 구글드라이브에 두고 실행 시작/종료마다
# 내려받고 올린다. 설정 방법은 docs/deploy_github_actions.md 참고.

on:
  # 자동 실행 중단 (2026-08-19). "좀 더 체계를 갖추고 시작하자"는 판단.
  #
  # 지금 멈춰 두는 이유는 성과가 나빠서가 아니라, 아직 재지 못한 것이
  # 남아 있어서다. 익절이 아예 없고(설계안 §15), 결정가 대비 체결가도
  # 표본이 0건이라 슬리피지를 추정값으로만 쓰고 있다. 그 상태로 기록을
  # 쌓으면 나중에 "이 기록이 어떤 규칙에서 나온 것인지" 되짚기 어렵다.
  #
  # 다시 켜려면 아래 schedule 두 줄의 주석을 풀면 된다. workflow_dispatch는
  # 남겨 뒀으므로 손으로는 언제든 돌릴 수 있다.
  # schedule:
  #   - cron: "5 0 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_enabled:
        description: "자동매매 킬스위치 (PC 없이 폰/브라우저로 즉시 on/off: 안 건드리면 기존 값 유지)"
        type: choice
        options: ["유지", "true", "false"]
        default: "유지"
      strategy:
        description: "이번 실행에 쓸 전략 키 (비우면 저장된 활성 전략 그대로: 지정하면 활성 전략 자체가 바뀐다)"
        default: ""

concurrency:
  # 상태 DB를 고치는 워크플로는 전부 이 그룹이다. DB가 구글드라이브의 파일
  # 하나라, 두 실행이 겹치면 나중 것이 앞 것을 통째로 덮는다. 장중 손절
  # 감시(watch-stops)가 5분마다 도는 뒤로 특히 그렇다.
  group: state-write
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: KIS/텔레그램 설정 갱신
        run: |
          python scripts/configure.py kis --env paper \
            --app-key "${{ secrets.KIS_APP_KEY }}" --app-secret "${{ secrets.KIS_APP_SECRET }}" \
            --account-no "${{ secrets.KIS_ACCOUNT_NO }}" --account-product-cd "01"
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 킬스위치 반영 (수동 실행 시 trading_enabled를 지정한 경우만)
        if: github.event.inputs.trading_enabled == 'true' || github.event.inputs.trading_enabled == 'false'
        run: python scripts/configure.py kill-switch --enabled "${{ github.event.inputs.trading_enabled }}"

      - name: 전략 교체 (수동 실행 시 strategy를 지정한 경우만)
        if: github.event.inputs.strategy != ''
        run: python scripts/configure.py strategy --active-key "${{ github.event.inputs.strategy }}"

      - name: 모의투자 실행
        run: python scripts/run_paper_trading.py

      - name: 일일 전략 리뷰 (다른 전략이었다면 어땠을지 비교, 텔레그램 발송)
        run: python scripts/run_daily_review.py

      - name: 상태 DB 구글드라이브에 업로드
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db
