name: 승인된 것만 매수

# 08:30에 제안한 후보 중 **시트에 Y가 적힌 것만** 산다.
#
#     08:30  매수 후보 제안  →  텔레그램 버튼  →  시트에 Y
#     09:05  여기 — Y가 적힌 것만 매수
#
# ## 매도는 승인과 무관하다
#
# 승인은 사는 것에만 걸린다. 들고 있는 종목의 손절·청산은 승인 여부와
# 관계없이 늘 돈다. 그래서 살펴볼 종목이 '승인된 것 ∪ 보유 중인 것'이다.
#
# ## 자동으로 돈다 — 다만 n8n이 부른다
#
# 아래 `schedule:`은 주석 처리된 채로 둔다. **일부러 그렇게 뒀다.**
# 매수는 몇 분만 늦어도 값이 달라지는 일인데 GitHub cron은 몇십 분씩
# 늦는다. 그래서 시각이 중요한 이 일은 n8n 시계가 부른다:
#
#     n8n AutoTrading_Schedule → "평일 09:05" 노드
#       → POST .../execute-approved.yml/dispatches  { dry_run: "false" }
#
# `workflow_dispatch`는 안 늦는다. 여기 schedule을 같이 켜면 하루에 두 번
# 사게 되므로(concurrency는 겹침만 막지 순서대로 두 번 도는 것은 못 막는다)
# **둘 중 하나만 켜져 있어야 한다.** 지금 켜진 쪽은 n8n이다.
#
# ## 모의투자 전용이다
#
# 스크립트가 kis.env == "real"이면 스스로 종료한다. 여기서 한 번 더 막지는
# 않는다 — 막는 자리가 여럿이면 어디서 막혔는지 알기 어려워진다.

on:
  # schedule:
  #   - cron: "5 0 * * 1-5"   # 평일 09:05 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "KIS에 안 붙고 야후 시세로 흉내만 (주문 안 나감)"
        type: boolean
        default: true

concurrency:
  # 두 번 겹쳐 돌면 같은 종목을 두 번 산다.
  group: execute-approved
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: KIS·텔레그램 설정 갱신
        run: |
          python scripts/configure.py kis --env paper \
            --app-key "${{ secrets.KIS_APP_KEY }}" --app-secret "${{ secrets.KIS_APP_SECRET }}" \
            --account-no "${{ secrets.KIS_ACCOUNT_NO }}" --account-product-cd "01"
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 승인된 것만 매수
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/execute_approved.py \
            ${{ github.event.inputs.dry_run != 'false' && '--dry-run' || '' }} \
            | tee execute.txt

      # 보유·현금 상태가 바뀌었을 수 있다. 안 올리면 다음 실행이 옛 상태로 돈다.
      #
      # **흉내만 낸 회차는 안 올린다.** 스크립트가 이미 사본에 쓰도록 고쳤지만
      # (muwon/db/scratch.py), 그게 뚫렸을 때 구글드라이브까지 번지지 않도록
      # 여기서 한 번 더 막는다. 2026-08-25에 dry-run이 운영 DB에 유령 보유를
      # 남기고 그걸 올려서, 계좌엔 없는 12주·51주를 DB가 들고 있게 됐다.
      - name: 상태 DB 올리기
        if: always() && github.event.inputs.dry_run == 'false'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      - name: 결과 아티팩트로 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-approved-${{ github.run_number }}
          path: execute.txt
