name: 매수 후보 제안

# 오늘 살 만한 종목을 골라 시트 `승인대기` 탭에 올리고 텔레그램으로 알린다.
#
# **아무것도 사지 않는다.** 후보를 적어 두기만 한다. 실제 매수는 사람이
# 시트에서 승인 칸에 Y를 적은 뒤에야 일어난다(아직 그 단계는 없다).
#
# ## 부르는 곳이 둘이다
#
# 며칠 손으로 돌려 보고 켰다(2026-08-24). 지금은 시계가 둘이다:
#
#   - 아래 `schedule:`  — 08:30 KST. GitHub의 cron은 몇십 분씩 늦는다.
#   - n8n `AutoTrading_Schedule`의 "평일 08:50" 노드 — 이쪽은 안 늦는다.
#
# 둘 다 부르지만 `propose_buys.py`가 하루에 한 번만 시트에 올린다. 먼저 온
# 쪽이 이기고 나중 것은 "오늘 것이 이미 있다"며 조용히 물러난다. 그래서
# GitHub cron이 늦어도 예전(08:50)보다 나빠지지 않고, 안 늦으면 20분 이르다.
#
# n8n 쪽 시각을 08:30으로 당기면 이 이중 구조를 없앨 수 있다.

on:
  # 08:30 KST 평일. 판단은 **어제 종가**로 하므로 장 열리기를 기다릴
  # 이유가 없다. 일찍 받을수록 승인할 시간이 길어진다.
  #
  # n8n 시계도 08:50에 같은 것을 부른다. 스크립트가 하루에 한 번만
  # 제안하므로 먼저 온 쪽이 이기고 나중 것은 조용히 물러난다.
  # GitHub cron은 몇십 분씩 늦지만, 늦어도 예전(08:50)보다 나빠지지 않는다.
  schedule:
    - cron: "30 23 * * 0-4"   # UTC. 한국시간 평일 08:30

  workflow_dispatch:
    inputs:
      dry_run:
        description: "시트·텔레그램에 안 보내고 화면에만 본다"
        type: boolean
        default: true
      max:
        description: "후보를 몇 개까지 (0이면 설정의 동시보유 수)"
        default: "0"
      max_per_sector:
        description: "한 섹터에서 몇 종목까지 (0이면 제한 없음)"
        default: "2"
      sector_filter:
        description: "강도 상위 섹터만 매수 대상으로 — 근거 없음(docs/섹터선정_검증.md)"
        type: boolean
        default: false

concurrency:
  group: propose-buys
  cancel-in-progress: false

jobs:
  propose:
    # 예약은 운영 저장소에서만 돈다(다른 워크플로와 같은 규칙).
    # 손으로 부르는 것과 n8n이 부르는 것은 어느 쪽에서든 그대로 된다.
    if: github.event_name != 'schedule' || github.repository == 'uTaxx/muwon406'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-propose-${{ github.run_id }}
          restore-keys: |
            prices-propose-
            prices-market-

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 후보 고르기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/propose_buys.py \
            --max "${{ github.event.inputs.max || '0' }}" \
            --max-per-sector "${{ github.event.inputs.max_per_sector || '2' }}" \
            ${{ github.event.inputs.sector_filter == 'true' && '--sector-filter' || '' }} \
            ${{ github.event_name != 'schedule' && github.event.inputs.dry_run != 'false' && '--dry-run' || '' }} \
            | tee propose.txt

      - name: 결과 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: propose-buys-${{ github.run_number }}
          path: propose.txt
