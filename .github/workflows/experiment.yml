name: 전략 실험

# Factor 기여도·가중치 스윕·전략 비교를 실제 매매 종목(운영 DB의 유니버스
# 스냅샷)으로 돌린다. 개발 환경에서 돌리면 기본 18종목이 쓰이는데, 상대강도는
# '유니버스 내 순위'이고 시장 국면은 '유니버스의 Breadth'라 종목 수가 결과를
# 직접 바꾼다.
#
# 결과는 운영 DB에 쓰지 않는다 — 실거래 기록과 섞이면 나중에 리포트를 읽을 때
# 헷갈린다. 대신 아티팩트로 올린다. 로그로만 남기던 시절엔 같은 표를 네 번
# 다시 만들었고, Actions 로그는 만료되므로 결국 아무것도 안 남는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 볼지"
        type: choice
        options: ["contribution", "sweep", "param", "strategies", "correlation", "blend", "slippage", "takeprofit", "holding", "combo", "entry", "intraday_stop", "overnight", "exit_timing", "fill_timing", "diagnose"]
        default: "contribution"
      universe:
        description: "market_cap=시총 상위(실거래 목록) / volume=거래대금 상위"
        type: choice
        options: ["market_cap", "volume"]
        default: "market_cap"
      from_year:
        description: "시작 연도"
        default: "2021"
      to_year:
        description: "종료 연도"
        default: "2025"
      factor:
        description: "sweep 대상 Factor"
        default: "relative_strength"
      weights:
        description: "sweep에 쓸 가중치 (쉼표 구분)"
        default: "0,10,20,30,40"
      param:
        description: "param 모드에서 바꿀 파라미터"
        default: "uptrend_ma"
      values:
        description: "param 모드에서 쓸 값 (쉼표 구분)"
        default: "0,120,200"
      regime_params:
        description: "국면 Factor 설정 덮어쓰기 JSON — diagnose는 그대로, param 모드는 고정값"
        default: ""
      keys:
        description: "strategies 모드는 비교할 전략 키(쉼표 구분, all이면 전부), diagnose 모드는 전략 하나"
        default: "volume_surge_5d,factor_score_v1,macd_cross"
      fill_timing:
        description: "체결 시점 — close=그날 종가(지금 백테스트) / open=다음 날 시가(실거래와 같은 규칙)"
        type: choice
        options: ["close", "open"]
        default: "close"

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      # 시세를 매 실행마다 다시 받으면 실험 하나에 30~60초가 그냥 나간다.
      # 종목 구성이 바뀌면 캐시가 안 맞을 수 있으므로 키에 유니버스 종류를
      # 넣고, restore-keys로 오래된 캐시도 일단 받아 쓴다 — 안 맞는 종목만
      # 다시 받으면 되고, 맞는지는 캐시가 구간 기록으로 판단한다.
      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-${{ github.event.inputs.universe || 'market_cap' }}-${{ github.run_id }}
          restore-keys: |
            prices-${{ github.event.inputs.universe || 'market_cap' }}-

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 구간 진단 (mode=diagnose)
        if: github.event.inputs.mode == 'diagnose'
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다 — 파이프라인의 결과는
          # 맨 끝 tee의 것이고 tee는 거의 안 죽는다. 2026-08-25에 매수가
          # KIS 403으로 통째로 터졌는데 워크플로는 초록불로 끝났다.
          # 조용히 성공한 척하는 실패라 여기서 막는다.
          set -o pipefail
          python scripts/diagnose_period.py \
            --strategy "${{ github.event.inputs.keys }}" \
            --year "${{ github.event.inputs.from_year }}" \
            --universe "${{ github.event.inputs.universe || 'market_cap' }}" \
            --regime-params '${{ github.event.inputs.regime_params }}' \
            | tee experiment-result.md

      - name: 실험 실행
        if: github.event.inputs.mode != 'diagnose'
        run: |
          python scripts/run_experiment.py "${{ github.event.inputs.mode || 'contribution' }}" \
            --universe "${{ github.event.inputs.universe || 'market_cap' }}" \
            --from-year "${{ github.event.inputs.from_year || '2021' }}" \
            --to-year "${{ github.event.inputs.to_year || '2025' }}" \
            --factor "${{ github.event.inputs.factor || 'relative_strength' }}" \
            --weights "${{ github.event.inputs.weights || '0,10,20,30,40' }}" \
            --param "${{ github.event.inputs.param || 'uptrend_ma' }}" \
            --values "${{ github.event.inputs.values || '0,120,200' }}" \
            --base-params '${{ github.event.inputs.regime_params }}' \
            --keys "${{ github.event.inputs.keys }}" \
            ${{ github.event.inputs.fill_timing == 'open' && '--entry-at-open --exit-at-open' || '' }} \
            --out experiment-result.md

      - name: 결과 아티팩트로 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ github.event.inputs.mode || 'contribution' }}-${{ github.run_number }}
          path: experiment-result.md
          if-no-files-found: warn
          retention-days: 90
