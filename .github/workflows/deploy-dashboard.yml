name: 대시보드 배포

# `dashboard/` 폴더를 GitHub Pages에 그대로 올린다.
#
# ## 빌드가 없다
#
# 정적 파일 셋(html·css·js)이라 npm도 번들러도 없다. 일부러 그렇게 했다.
# 이 저장소가 스트림릿에서 겪은 것이 **"배포가 밀려서 다른 화면을 본다"**
# 였고, 빌드 단계는 그런 밀림이 생기는 자리다. 올릴 것이 그대로 올라가면
# 어긋날 구석이 없다.
#
# ## 켜기 전에 한 번만 (사람)
#
# Settings → Pages → **Source**를 **GitHub Actions**로 바꿔야 한다.
# 안 바꾸면 이 워크플로가 배포 단계에서 거부당한다.
#
# 이 저장소는 Pages 자리가 비어 있다. muwon406은 그 자리를 맛집 대시보드가
# 쓰고 있어서 여기로 옮겨 온 것이다(docs/이관_sdlab_trading.md).

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살아남으면 된다. 화면은 늘 최신 하나뿐이다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # ── 이 저장소에서만 배포한다 ────────────────────────────────
    # 이 파일은 muwon406에도 똑같이 들어 있다(두 저장소를 같게 유지한다).
    # 그런데 muwon406의 Pages 자리는 **맛집·카페 대시보드**가 쓰고 있다.
    # 거기서 이걸 손으로 한 번만 불러도 그 화면이 통째로 갈아치워진다.
    # 되돌릴 수 없는 종류의 사고라 코드로 막는다.
    if: github.repository == 'uTaxx/sdlab_trading'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # id와 표현식은 영문으로 둔다. GitHub Actions 표현식 파서가 한글
      # 식별자를 못 읽어서, steps.배포.outputs...로 쓰면 워크플로 파일이
      # 통째로 파싱에 실패한다. 잡이 하나도 안 잡힌 채 0초 만에 끝난다.
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 계좌 자료가 섞여 들어가지 않았는지 본다
        # 이 저장소는 공개다. 화면 파일에 숫자가 박히면 보유 종목과 잔고가
        # 공개되고 그건 되돌릴 수가 없다(캐시·크롤러). 올리기 전에 막는다.
        run: |
          if grep -rniE '"(현금|순자산|평가손익)"[[:space:]]*:[[:space:]]*[0-9]{5,}' \
               dashboard/ --include=*.html --include=*.css \
               | grep -v 'app.js'; then
            echo "::error::화면 파일에 계좌 숫자로 보이는 것이 있다. 올리지 않는다."
            exit 1
          fi
          echo "확인됨: 화면 파일에 계좌 숫자가 없다."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 설명이 파이썬 원본과 어긋나지 않았는지 본다
        # 용어 사전과 전략 설명의 원본은 파이썬이고, dashboard/자료/*.json은
        # 거기서 뽑아 둔 사본이다. 원본만 고치고 다시 안 뽑으면 화면이 옛
        # 설명을 계속 보여 준다. 조용히 틀리는 쪽이라 올리기 전에 막는다.
        run: |
          pip install -e ".[dev]" --quiet
          python scripts/export_dashboard_data.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        name: Pages에 올리기
        uses: actions/deploy-pages@v4
