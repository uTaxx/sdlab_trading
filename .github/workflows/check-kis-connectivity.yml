name: KIS 접속 가능 여부 확인

# GitHub Actions 러너에서 KIS 서버(비표준 포트 9443/29443)에 실제로
# 접속되는지만 확인하는 진단용 워크플로우. 비밀값이 전혀 필요 없다.
# 본격적인 매매 자동화(구글드라이브 상태 동기화 등)를 짜기 전에, 이 환경
# 자체가 KIS 포트를 막고 있어서 그 작업이 무의미해지는 건 아닌지부터
# 가볍게 확인하기 위한 용도.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 모의투자(29443) 접속 확인
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" --max-time 10 \
            -X POST "https://openapivts.koreainvestment.com:29443/oauth2/tokenP" \
            -H "Content-Type: application/json" -d '{}' || echo "연결 실패"

      - name: 실전투자(9443) 접속 확인
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" --max-time 10 \
            -X POST "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
            -H "Content-Type: application/json" -d '{}' || echo "연결 실패"
