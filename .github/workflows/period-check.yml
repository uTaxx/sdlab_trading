name: 기간별 전략 검증

# 지금 걸린 전략을 최근 1주·1개월·3개월·12개월·5년에 돌려 보고 결과를
# 시트에 남긴다. 1주와 1개월은 거래가 몇 건뿐이라 판단에 쓸 숫자가 아니다.
#
# `strategies`에 '전부'를 주면 등록된 전략 27개를 **같은 구간·같은 기준**으로
# 돌려 순위를 낸다. 빠지는 구간에서 어느 전략이 덜 잃었는지를 보는 용도다.
# '매수키>전부'는 반대다. 사는 쪽을 고정하고 **파는 쪽만** 갈아 끼운다.
# 사는 조건이 나쁜 건지 파는 조건이 나쁜 건지를 가르는 자리다.
# 그 결과는 '기간비교' 탭에 따로 쌓는다 — 검증 탭과 섞으면 어느 줄이 지금
# 도는 전략인지 알 수 없다.
#
# ## 아무것도 사지 않는다
#
# 과거 시세로 돌려 보기만 한다. 증권사에 붙지 않는다. 상태 DB는 **읽기만**
# 한다 — 지금 무슨 전략이 걸려 있는지를 알아야 해서 내려받을 뿐이고,
# 도로 올리지 않는다. 그래서 state-write 그룹에 안 묶는다.
#
# ## 누가 부르나
#
# 대시보드의 '이 전략으로 돌려 보기' 단추다. n8n 창구(wj3pZvpHJPekTaoI)가
# 이 워크플로를 dispatch 한다. 손으로도 부를 수 있다.
#
# ## 실패하면 무엇이 빨개지나
#
# 셋이다. 이 워크플로가 빨개지고, 시트 '기간검증' 탭에 상태가 '실패'인 줄이
# 남고, 화면이 그 줄을 그대로 보여 준다. 스크립트가 예외를 잡아 실패 줄을
# 남긴 뒤 1로 끝내므로 초록불이 뜨는 길이 없다.

on:
  workflow_dispatch:
    inputs:
      # **입력 이름은 영문으로 둔다.** GitHub Actions 표현식 파서가 한글
      # 식별자를 못 읽는다. `github.event.inputs.기간`을 쓰면 워크플로 파일이
      # 통째로 파싱에 실패하고, dispatch가 422로 거절된다(2026-08-28에 겪음).
      # 고를 값은 한글이어도 된다 — 그건 그냥 글자다.
      period:
        description: "어느 구간을 잴 것인가"
        type: choice
        options:
          - 전부
          - 1주
          - 1개월
          - 3개월
          - 12개월
          - 5년
        default: 전부
      strategies:
        description: "어느 전략을 잴 것인가 (지금 / 전부 / 전략키 / 매수키>매도키 / 매수키>전부)"
        default: "지금"
      no_cache:
        description: "시세 캐시를 쓰지 않고 새로 받는다"
        type: boolean
        default: false

concurrency:
  # 같은 검증이 두 번 겹치면 시트에 같은 시각 줄이 둘 쌓인다. 앞의 것을
  # 끊는다 — 뒤에 누른 것이 사람이 지금 보고 싶은 것이다.
  group: period-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      # 5년치 시세를 매번 받으면 야후가 막는다. 하루에 한 번만 받고
      # 나머지 회차는 캐시에서 쓴다.
      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-period-check-${{ github.run_id }}
          restore-keys: |
            prices-period-check-
            prices-

      - name: 구글드라이브에서 상태 DB 내려받기 (읽기만 한다)
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 기간별로 돌려 보기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # **사람이 넣은 값은 명령 줄에 직접 박지 않는다.** `${{ }}`는 셸
          # 스크립트 글자 안으로 그대로 치환되므로, 따옴표나 `$(...)`가 섞인
          # 값이 오면 그게 명령으로 실행된다. 화면에서 전략을 골라 보낼 수
          # 있게 한 뒤로 이 자리에 아무 글자나 들어올 수 있다.
          # 환경변수로 넘기면 셸이 그 값을 글자로만 본다.
          MUWON_PERIOD: ${{ github.event.inputs.period || '전부' }}
          MUWON_STRATEGIES: ${{ github.event.inputs.strategies || '지금' }}
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다. 조용히 성공한 척하는
          # 실패가 이 저장소에서 제일 비싼 종류다.
          set -o pipefail
          python scripts/run_period_check.py \
            --기간 "$MUWON_PERIOD" \
            --전략 "$MUWON_STRATEGIES" \
            ${{ github.event.inputs.no_cache == 'true' && '--no-cache' || '' }} \
            | tee period-check.txt

      - name: 결과 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: period-check-${{ github.run_number }}
          path: period-check.txt
          retention-days: 30
