name: Apps Script 배포

# `apps-script/trading`를 Google Apps Script에 올린다. 도구는 clasp이고,
# 로그인은 주인이 PC에서 한 번 한 뒤 생긴 `~/.clasprc.json`을 비밀값
# CLASPRC_JSON에 넣어 둔 것을 쓴다.
#
# ## 이 워크플로가 하는 일
#
# 1. Node 시험(apps-script/tests)을 먼저 돈다. 떨어지면 올리지 않는다.
# 2. mode
#    create  프로젝트를 새로 만들고 코드를 올린 뒤 scriptId를 로그에 찍는다.
#            그 값을 .clasp.json에 적어 커밋해야 다음부터 push가 된다.
#    push    코드만 올린다. main에 apps-script/**가 바뀔 때의 기본이다.
#    deploy  판을 만들고 웹 앱 배포를 갱신한다. deployment.json의 deploymentId가
#            비어 있으면 새 배포를 만들고 ID를 로그에 찍는다. 그 값을 적어
#            커밋해야 주소가 고정된다.
# 3. 비밀값이 없으면: 사람이 실행한 것(workflow_dispatch)은 빨갛게 끝내고,
#    push로 온 것은 경고만 남기고 건너뛴다. 비밀값을 넣기 전의 합치기마다
#    빨간불이 뜨면 진짜 실패와 구별이 안 된다.
#
# ## 사람이 한 번 할 것
#
# - https://script.google.com/home/usersettings 에서 Apps Script API 켜기
# - PC에서 `npx @google/clasp login` 후 `.clasprc.json`을 비밀값 CLASPRC_JSON에
# - 첫 배포 뒤 편집기에서 `권한확인` 실행하고 「허용」
#
# 식별자는 영문, 사람이 읽는 name·description·값은 한글이다.
# `${{ github.event.inputs.* }}`는 run: 안에 직접 넣지 않고 env:로 넘긴다.

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-deploy.yml"
  pull_request:
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "create는 프로젝트 새로 만들기, push는 코드만, deploy는 웹 앱 배포까지"
        type: choice
        options: [push, deploy, create]
        default: push

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 문법 검사
        working-directory: apps-script
        run: npm run check
      - name: 순수 함수 시험
        working-directory: apps-script
        run: npm test

  deploy:
    needs: test
    # 이 저장소에서만, 그리고 PR에서는 올리지 않는다.
    if: github.repository == 'uTaxx/sdlab_trading' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'push' }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      PROJECT_DIR: apps-script/trading
      PROJECT_TITLE: "sdlab 매매"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: clasp 로그인 파일 만들기
        id: login
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::CLASPRC_JSON 비밀값이 비어 있습니다. PC에서 clasp login 뒤 ~/.clasprc.json 내용을 넣으세요."
              exit 1
            fi
            echo "::warning::CLASPRC_JSON 비밀값이 아직 없어 올리지 않습니다. 시험만 통과했습니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 올리기
        if: steps.login.outputs.skip != 'true'
        run: |
          set -eu
          npm install --no-audit --no-fund -g @google/clasp@3.4.1
          cd "$PROJECT_DIR"
          script_id=$(node -e "console.log(require('./.clasp.json').scriptId || '')")
          if [ "$MODE" = "create" ]; then
            if [ -n "$script_id" ]; then
              echo "::error::.clasp.json에 scriptId가 이미 있습니다($script_id). 새로 만들지 않습니다."
              exit 1
            fi
            rm -f .clasp.json
            clasp create-script --title "$PROJECT_TITLE" --type standalone --rootDir src
            echo "== 새 프로젝트를 만들었습니다. 아래 scriptId를 .clasp.json에 적어 커밋하세요."
            cat .clasp.json
            clasp push -f
            exit 0
          fi
          if [ -z "$script_id" ]; then
            echo "::error::.clasp.json의 scriptId가 비어 있습니다. mode=create로 먼저 만드세요."
            exit 1
          fi
          echo "== 코드 올리기 (mode=$MODE)"
          clasp push -f
          if [ "$MODE" = "deploy" ]; then
            deploy_id=$(node -e "console.log(require('./deployment.json').deploymentId || '')")
            clasp create-version "배포 ${GITHUB_SHA::7}"
            if [ -z "$deploy_id" ]; then
              echo "== 배포 ID가 없어 새 배포를 만듭니다. 아래 ID를 deployment.json에 적어 커밋하세요."
              clasp create-deployment -d "웹 앱 ${GITHUB_SHA::7}"
            else
              clasp create-deployment -i "$deploy_id" -d "웹 앱 ${GITHUB_SHA::7}"
            fi
          fi

      - name: 로그인 파일 지우기
        if: always()
        run: rm -f "$HOME/.clasprc.json"

      - name: 실패하면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
