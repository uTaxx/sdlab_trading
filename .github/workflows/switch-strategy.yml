name: 쓰는 전략 바꾸기

# 지금 걸린 전략을 다른 것으로 바꾼다.
#
# ## 왜 워크플로로 두나
#
# 활성 전략은 상태 DB(`strategy.active_keys`)에 있고, 그 DB는 구글드라이브에
# 있다. 여기서만 닿는다. 대시보드에서 고를 수는 있어도 저장은 안 되게 해
# 뒀다. 화면에서 조용히 바뀌면 안 되는 값이라 그렇다.
#
# ## 매수와 매도를 따로 걸 수 있다
#
# `key`만 주면 그 전략이 사는 것과 파는 것을 다 맡는다(지금까지의 동작).
# `sell_key`를 같이 주면 **파는 신호는 그쪽에서만** 나온다. 보유 기간 상한도
# 파는 쪽 것을 쓴다. 그것도 청산 규칙이라 파는 자리를 두 군데로 나누면
# 왜 팔렸는지 설명할 수 없게 된다.
#
# 섞은 조합은 이름이 없으므로 **성적표에도 없다.** 미리보기가 그 사실을
# 말한다. 안 재 본 조합을 숫자 없이 내놓으면 재 본 것처럼 읽힌다.
#
# ## 바꾸면 지금 들고 있는 종목은 어떻게 되나
#
# **산 전략의 파는 규칙 그대로 팔린다**(2026-09-02에 고침). 보유 기록의
# `strategy_key`로 그 종목을 산 전략을 찾아 청산을 맡긴다. 새 전략은 새로
# 사는 것부터 적용된다. 전에는 지금 걸린 전략 하나가 보유 종목 전부의 청산을
# 정해서, 바꾸는 순간 규칙이 발밑에서 바뀌었다.
#
# ## 예약과 즉시 바꾸기
#
# `reserve`는 텔레그램 버튼과 같은 길이다. 다음 거래일 08:20에 반영되면서
# 시트 사본, 변경 이력, 알림이 따라온다. 직전 반영으로부터 30일이 안 지났으면
# 08:20 반영이 막힌다(`strategy-apply.yml`의 `min_hold_days`). `apply`는
# 지금 당장 DB만 바꾼다. 시트 사본과 변경 이력은 안 따라온다.
#
# ## 기본은 미리보기다
#
# `apply`를 켜지 않으면 지금 무엇이 걸려 있고 무엇으로 바뀌는지만 보여 준다.
# 매매 규칙을 바꾸는 도구라 실수로 도는 쪽이 아니라 실수로 안 도는 쪽으로
# 기울여 뒀다.
#
# **`apply`는 문자열로 받는다.** `type: boolean`에 문자열 "false"를 넘기면
# 참으로 읽혀서 조용히 반대로 도는 일이 실제로 있었다(2026-08-26).

on:
  workflow_dispatch:
    inputs:
      key:
        description: "사는 쪽 전략 키 (비우면 지금 무엇이 걸려 있는지와 고를 수 있는 목록만 보여 준다)"
        default: ""
      sell_key:
        description: "파는 쪽 전략 키. 비우면 사는 쪽이 양쪽을 다 맡는다. '같게'라고 적으면 따로 걸어 둔 것을 지운다"
        default: ""
      apply:
        description: "true면 지금 당장 바꾼다 (그 밖의 값은 전부 미리보기)"
        default: "false"
      reserve:
        description: "true면 다음 거래일 08:20에 반영되도록 예약만 한다. 텔레그램 버튼과 같은 길이라 시트 사본과 변경 이력과 알림이 따라온다"
        default: "false"
      via:
        description: "어디서 고른 것인가. 최소 운용기간 30일을 따질지 정한다"
        type: choice
        options: ["대화", "화면"]
        default: "대화"

concurrency:
  # 상태 DB를 고치는 일이라 겹치면 나중 것이 앞 것을 덮는다.
  group: state-write
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 바꾸기
        # **입력값을 `run:` 안에 직접 박지 않는다**(2026-09-05에 고침).
        # `${{ github.event.inputs.* }}`는 셸 글자 안으로 그대로 치환돼서
        # 따옴표나 `$(...)`가 섞인 값이 명령으로 실행된다. 화면에서 전략을
        # 골라 보낼 수 있게 한 뒤로 이 자리에 아무 글자나 들어올 수 있다.
        # 환경변수로 넘기면 셸이 그 값을 글자로만 본다.
        env:
          KEY: ${{ github.event.inputs.key }}
          SELL_KEY: ${{ github.event.inputs.sell_key }}
          VIA: ${{ github.event.inputs.via }}
          APPLY: ${{ github.event.inputs.apply }}
          RESERVE: ${{ github.event.inputs.reserve }}
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다. 조용히 성공한 척하는
          # 실패가 이 저장소에서 제일 비싼 종류다.
          set -o pipefail
          # **셸 변수 이름은 영문이어야 한다.** 한글로 대입하면 bash가
          # `command not found`로 죽는다(2026-09-01에 겪음).
          ARGS=""
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$RESERVE" = "true" ]; then ARGS="$ARGS --reserve"; fi
          if [ -n "$VIA" ]; then ARGS="$ARGS --via $VIA"; fi
          python scripts/switch_strategy.py \
            --key "$KEY" \
            --sell-key "$SELL_KEY" \
            $ARGS \
            | tee switch.txt

      # 미리보기였으면 DB가 안 바뀌었으므로 올릴 것도 없다. 그래도 올리면
      # 그 사이 다른 실행이 쓴 것을 옛 것으로 덮을 수 있다.
      #
      # **앞 단계가 실패해도 올린다**(2026-09-06에 고침). 파이썬이 DB에
      # 쓰고 나서 종료 코드 1로 끝나는 길이 있다. 실제로 예약 취소가
      # 그랬다. 그때 이 단계를 건너뛰면 취소가 로컬 파일에만 남고
      # 드라이브에는 안 올라가서, 화면에는 취소했다고 찍히는데 다음 날
      # 아침에 그대로 반영된다.
      - name: 상태 DB 올리기
        if: always() && (github.event.inputs.apply == 'true' || github.event.inputs.reserve == 'true')
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      - name: 결과 아티팩트로 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-strategy-${{ github.run_number }}
          path: switch.txt
