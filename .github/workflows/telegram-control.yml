name: 텔레그램 명령 받기

# 텔레그램에서 온 명령을 읽어 구글 시트의 기준을 고친다.
#
# ## 왜 물어보러 가나
#
# 봇에 웹훅을 걸지 않는다. 받으려면 상시 도는 서버가 필요한데 이 저장소에는
# 그런 게 없다. 대신 여기서 주기적으로 getUpdates로 물어본다. 늦어야 몇
# 분이고, 설정을 바꾸는 일에 몇 분은 늦어도 된다.
#
# ## 안전
#
# - 저장된 chat_id에서 온 것만 듣는다 (봇 이름은 누구나 알 수 있다)
# - **매매를 켜는 것은 여기서 못 한다.** 끄는 것만 된다
# - 값 검증은 시트에서 읽을 때와 같은 규칙을 쓴다
#
# 장중에만 자주 본다. 밤새 5분마다 도는 것은 낭비다.

on:
  # 자동 실행 중단 (2026-08-24). n8n이 웹훅으로 받게 됐다.
  #
  # 한 봇을 두 곳에서 받을 수 없어서, 이제 여기는 물어보러 가도 영영
  # 빈손이다. 스스로 물러나긴 하지만 장중 10분마다(하루 54번) 헛도는
  # 실행이 쌓이는 건 그것대로 낭비다.
  #
  # **되돌리는 길로 남겨 둔다.** n8n 워크플로를 Unpublish 하면 웹훅이
  # 풀리고 이쪽이 다시 먹는다. 그때 아래 두 줄의 주석을 풀면 된다.
  # workflow_dispatch는 남겨 뒀으므로 손으로는 언제든 돌릴 수 있다.
  # schedule:
  #   - cron: "*/10 23,0-7 * * 0-5"   # 08:00~16:50 KST에 10분마다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "읽기만 하고 아무것도 안 고친다"
        type: boolean
        default: false

concurrency:
  # 둘이 동시에 돌면 같은 명령을 두 번 실행한다. 그리고 이 워크플로는
  # 상태 DB도 고친다. 그룹은 하나만 걸 수 있어서 DB 쪽으로 맞춘다.
  # 명령이 두 번 도는 것보다 DB가 통째로 덮이는 쪽이 훨씬 비싸다.
  group: state-write
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 명령 처리
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/telegram_control.py --touch-when-changed .changed \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 읽은 위치(offset)를 안 올려 두면 다음 실행에서 같은 명령이 또 돈다.
      # 처리한 것이 없으면 안 올린다. 10분마다 무조건 올리면 다른 워크플로가
      # 같은 파일을 올리는 순간과 겹쳐 한쪽 변경이 통째로 덮일 수 있다.
      - name: 상태 DB 올리기
        if: ${{ hashFiles('.changed') != '' }}
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db
