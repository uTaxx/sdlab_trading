name: 섹터 시트 동기화

# 섹터·종목·설정을 구글 시트로 올리거나, 시트를 읽어 검증한다.
#
# 대시보드를 걷어내고 시트를 화면으로 쓰기로 한 설계의 첫 조각이다
# (docs/설계_스트림릿을_걷어낼까.md). 구글 자격증명이 GitHub Secrets에만
# 있어서 손으로 돌릴 수 없고, 이 워크플로로 돌린다.
#
# **push는 시트를 통째로 덮어쓴다.** 처음 한 번만 쓰고, 그 뒤로는 사람이
# 시트에서 고치고 코드는 읽기만 한다.
#
# 주문은 내지 않는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check=읽고 검증만 / push-catalog=종목 목록만 갱신(설정 유지) / add-missing-settings=빠진 기준 줄만 채우기 / set=기준 바꾸기 / push=통째로 덮어쓰기(첫 채움 전용)"
        type: choice
        options: ["check", "push-catalog", "add-missing-settings", "set", "push"]
        default: "check"
      set:
        description: "mode=set일 때 바꿀 기준. 쉼표로 여럿 (예: max_per_sector=3,max_concurrent_positions=8)"
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 시트 동기화
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # **사람이 넣은 값을 명령 줄에 직접 박지 않는다.** `${{ }}`는 셸
          # 스크립트 글자 안으로 그대로 치환되므로, `$(...)`가 섞인 값이
          # 오면 그것이 명령으로 실행된다. 환경변수로 넘기면 셸이 그 값을
          # 글자로만 본다.
          MUWON_MODE: ${{ github.event.inputs.mode }}
          MUWON_SET: ${{ github.event.inputs.set }}
        run: |
          set -o pipefail
          if [ "$MUWON_MODE" = "push" ]; then
            python scripts/sync_sector_sheet.py --push
          elif [ "$MUWON_MODE" = "push-catalog" ]; then
            python scripts/sync_sector_sheet.py --push-catalog
          elif [ "$MUWON_MODE" = "add-missing-settings" ]; then
            python scripts/sync_sector_sheet.py --add-missing-settings
          elif [ "$MUWON_MODE" = "set" ]; then
            python scripts/sync_sector_sheet.py --set "$MUWON_SET"
          else
            python scripts/sync_sector_sheet.py
          fi
