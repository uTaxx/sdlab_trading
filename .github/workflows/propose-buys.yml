name: 매수 후보 제안

# 오늘 살 만한 종목을 골라 시트 `승인대기` 탭에 올리고 텔레그램으로 알린다.
#
# **아무것도 사지 않는다.** 후보를 적어 두기만 한다. 실제 매수는 사람이
# 시트에서 승인 칸에 Y를 적은 뒤에야 일어난다(아직 그 단계는 없다).
#
# ## 부르는 곳이 둘이다
#
# 며칠 손으로 돌려 보고 켰다(2026-08-24). 지금은 둘 다 08:30에 부른다:
#
#   - n8n `AutoTrading_Schedule`의 "평일 08:30" 노드: **이쪽이 진짜 시계다.**
#     n8n은 정시를 지킨다.
#   - 아래 `schedule:`: 같은 08:30. GitHub의 cron은 몇십 분씩 늦어서
#     혼자 두면 못 믿는다. n8n이 죽었을 때를 위한 예비다.
#
# 둘 다 부르지만 `propose_buys.py`가 하루에 한 번만 시트에 올린다. 먼저 온
# 쪽이 이기고 나중 것은 "오늘 것이 이미 있다"며 조용히 물러난다.
#
# ## 왜 08:30인가
#
# 판단이 **어제 종가**로 이뤄진다. 프리장도 시초가도 안 본다. 그래서 장이
# 열리기를 기다릴 이유가 없고, 일찍 받을수록 승인할 시간이 길어진다.
# 09:05에 승인된 것만 사므로 08:30이면 35분이 생긴다(예전 08:50은 15분).

on:
  # 08:30 KST 평일: n8n의 "평일 08:30" 노드와 같은 시각이다. n8n이
  # 안 도는 날을 위한 예비이고, 늦게 떠도 하루 한 번 제한이 막아 준다.
  schedule:
    - cron: "30 23 * * 0-4"   # UTC. 한국시간 평일 08:30

  workflow_dispatch:
    inputs:
      dry_run:
        description: "시트·텔레그램에 안 보내고 화면에만 본다"
        type: boolean
        default: true
      max:
        description: "후보를 몇 개까지 (0이면 설정의 동시보유 수)"
        default: "0"
      max_per_sector:
        description: "한 섹터에서 몇 종목까지 (비우거나 -1이면 시트 값, 0이면 제한 없음)"
        default: "-1"
      sector_filter:
        description: "강도 상위 섹터만 매수 대상으로: 근거 없음(docs/섹터선정_검증.md)"
        type: boolean
        default: false
      force:
        description: "오늘 후보가 이미 시트에 있어도 다시 뽑는다 (전략을 바꾸고 다시 제안할 때)"
        type: boolean
        default: false

concurrency:
  group: propose-buys
  cancel-in-progress: false

jobs:
  propose:
    # 예약은 운영 저장소에서만 돈다(다른 워크플로와 같은 규칙).
    # 손으로 부르는 것과 n8n이 부르는 것은 어느 쪽에서든 그대로 된다.
    if: github.event_name != 'schedule' || github.repository == 'uTaxx/muwon406'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-propose-${{ github.run_id }}
          restore-keys: |
            prices-propose-
            prices-market-

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 후보 고르기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # 입력을 `run:` 글자 안으로 치환하지 않고 환경변수로 넘긴다.
          # 치환하면 값 안의 `$(...)`가 명령으로 실행된다.
          MUWON_FORCE: ${{ github.event.inputs.force }}
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다. 파이프라인의 결과는
          # 맨 끝 tee의 것이고 tee는 거의 안 죽는다. 2026-08-25에 매수가
          # KIS 403으로 통째로 터졌는데 워크플로는 초록불로 끝났다.
          # 조용히 성공한 척하는 실패라 여기서 막는다.
          set -o pipefail
          # 셸 변수 이름에 한글을 쓰면 bash가 command not found로 죽는다.
          FORCE_ARG=""
          if [ "$MUWON_FORCE" = "true" ]; then FORCE_ARG="--force"; fi
          echo "■ 다시 뽑기: ${FORCE_ARG:-아니오}"
          # `--max-per-sector`의 기본값은 **-1이어야 한다.** 여기에 숫자를
          # 박아 두면 `propose_buys.py`가 `args.max_per_sector >= 0`을 보고
          # 시트의 `max_per_sector`를 아예 안 읽는다. 예약 실행은 inputs가
          # 비어서 `|| '2'`로 떨어지므로, 08:30이 매일 시트를 무시하고 2를
          # 쓰고 있었다(2026-09-01에 찾음). 시트에서 값을 바꿔도 아무 일도
          # 일어나지 않았고, 아무것도 빨개지지 않았다.
          python scripts/propose_buys.py \
            --max "${{ github.event.inputs.max || '0' }}" \
            --max-per-sector "${{ github.event.inputs.max_per_sector || '-1' }}" \
            ${{ github.event.inputs.sector_filter == 'true' && '--sector-filter' || '' }} \
            ${{ github.event_name != 'schedule' && github.event.inputs.dry_run != 'false' && '--dry-run' || '' }} \
            $FORCE_ARG \
            | tee propose.txt

      - name: 결과 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: propose-buys-${{ github.run_number }}
          path: propose.txt

      # **실패했으면 반드시 알린다.** GitHub 화면의 빨간불을 매일 보는
      # 사람이 없으면 빨간불은 없는 것과 같다. 2026-09-04에 08:30 후보
      # 산출이 죽었는데 주인은 다음 날까지 모르셨다.
      - name: 실패했으면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          what: "08:30 매수 후보 산출"
          extra: "오늘 매수 후보가 나오지 않았습니다."
