name: 시장·섹터 리포트

# 오늘 장이 어떻게 끝났고, 비슷했던 과거에는 그 뒤 무슨 일이 있었나.
#
# **아무것도 사지 않는다. 보는 것만 한다.**
#
# ## 왜 아침이 아니라 전날 저녁인가
#
# 예전에는 평일 08:40에 돌렸다. 장 시작 전에 그날 상태를 보려던 것인데,
# **그 시각에 봐도 내용은 전날 것이었다.** `build_state`가 한 칸이라도 빈
# 날을 버리므로(dropna) 기준은 언제나 **마지막으로 완성된 일봉**이다.
#
#   전날 20:00에 돌리면  → 기준 = 그날 종가 (장이 15:30에 끝났으니 완성)
#   다음날 08:40에 돌리면 → 기준 = 어제 종가 (같은 날이다)
#
# 즉 **같은 내용을 12시간 늦게 받고 있었다.** 저녁에 받으면 자고 일어나기
# 전에 읽을 시간이 생기고, 다음 날 08:30 후보를 볼 때 이미 장 상태를 알고
# 본다. 20:00으로 정한 것은 마감 4시간 반 뒤라 야후에 일봉이 올라오고도
# 남는 시각이기 때문이다.
#
# **아무것도 사지 않는다. 보는 것만 한다.** 그래서 지연에도 강하다.
# 리포트 첫 줄에 기준 날짜가 찍히므로, 자료가 아직 안 왔으면 날짜로 드러난다.

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 월~금 11:00 UTC = 그날 20:00 KST (장 끝난 뒤)
  workflow_dispatch:
    inputs:
      lens:
        description: "지표 묶음"
        type: choice
        options: ["확장", "기본"]
        default: "확장"
      horizon:
        description: "앞으로 며칠을 볼 것인가"
        default: "20"
      as_of:
        description: "이 날짜 기준으로 본다 (비우면 최신). 예: 2022-06-15"
        default: ""
      no_send:
        # 문자열로 받는다. type: boolean에 문자열 "false"를 넘기면 참으로
        # 읽혀서 조용히 반대로 도는 일이 실제로 있었다(2026-08-26).
        description: "true면 요약을 로그에만 찍고 텔레그램으로 안 보낸다"
        default: "false"

concurrency:
  # 앞 실행이 느려 다음 정시를 넘기면 둘이 동시에 돈다. 시세 캐시를 둘 다
  # 쓰면 하나가 깨진다.
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    # ── 예약은 운영 저장소에서만 돈다 ──────────────────────────
    # 이 코드는 두 저장소(muwon406·sdlab_trading)에 똑같이 들어 있다.
    # 양쪽에서 예약이 울리면 같은 일이 하루에 두 번 돌고, push-records는
    # 시트에 같은 줄을 두 번 쌓는다.
    #
    # n8n 시계가 아직 muwon406을 부르므로 그쪽이 운영이다. n8n을 옮기는
    # 날 이 이름을 sdlab_trading으로 바꾼다. **양쪽 저장소에서 같이.**
    # 손으로 부르는 것(workflow_dispatch)은 어느 쪽에서든 그대로 된다.
    if: github.event_name != 'schedule' || github.repository == 'uTaxx/muwon406'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-market-${{ github.run_id }}
          restore-keys: |
            prices-market-
            prices-market_cap-

      - name: 구글드라이브에서 상태 DB 내려받기 (텔레그램 설정을 읽는다)
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 리포트 작성
        env:
          # 낸 전망을 시트 `전망기록` 탭에도 덧붙인다. 열쇠가 (낸날·대상·지평)
          # 이라 재실행해도 줄이 늘지 않는다.
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/market_report.py --telegram --sheet \
            ${{ github.event.inputs.no_send == 'true' && '--no-send' || '' }} \
            --lens "${{ github.event.inputs.lens || '확장' }}" \
            --horizon "${{ github.event.inputs.horizon || '20' }}" \
            --as-of "${{ github.event.inputs.as_of }}" \
            --out market-report.md

      - name: 결과 아티팩트로 올리기
        # 텔레그램을 못 보내면 스크립트가 1을 낸다(그건 실패가 맞다).
        # 그래도 리포트 자체는 다 만들어졌으니 남긴다. 폰으로 못 받은 날일수록
        # 여기서 읽을 수 있어야 한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_number }}
          path: market-report.md
