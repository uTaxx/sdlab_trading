name: 전략 다기간 검증

# 전략을 연 단위로 쪼개 돌려 "그때만 잘 맞았던 전략"을 걸러낸다.
#
# 왜 워크플로가 필요한가: 검증은 **실제 매매 대상 종목으로** 해야 의미가 있다.
# 유니버스 스냅샷은 구글드라이브의 운영 DB에만 있어서, 개발 환경에서 돌리면
# 기본 18종목으로 검증하게 된다 — 상대강도(유니버스 내 순위)와 시장 국면
# (Breadth)은 종목 수에 직접 영향을 받으므로 결과가 달라진다.
#
# 결과는 backtest_runs 테이블에 쌓여 주간 분석 리포트의 '다기간 검증' 항목을
# 채운다. 그래서 실행이 성공하면 DB를 다시 올린다.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "검증할 전략 키 (쉼표 구분, 비우면 전체 22종)"
        default: "factor_score_v1,volume_surge_5d,macd_cross,donchian_20_10"
      from_year:
        description: "시작 연도"
        default: "2021"
      to_year:
        description: "종료 연도"
        default: "2025"

concurrency:
  # 상태 DB를 고치는 워크플로는 전부 이 그룹이다. DB가 구글드라이브의 파일
  # 하나라, 두 실행이 겹치면 나중 것이 앞 것을 통째로 덮는다. 장중 손절
  # 감시(watch-stops)가 5분마다 도는 뒤로 특히 그렇다.
  group: state-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 60종목 시세 수집 + 전략마다 구간별 백테스트라 기본 6시간보다 훨씬 짧지만,
    # 야후 응답이 느려질 때를 대비해 넉넉히 잡되 무한정 돌지는 않게 한다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 다기간 검증
        run: |
          python scripts/run_robustness_check.py \
            --from-year "${{ github.event.inputs.from_year || '2021' }}" \
            --to-year "${{ github.event.inputs.to_year || '2025' }}" \
            ${{ github.event.inputs.keys && format('--keys "{0}"', github.event.inputs.keys) || '' }}

      # 검증이 실패하면 결과가 반쪽이므로 올리지 않는다 — 운영 DB에 어중간한
      # 기록이 섞이면 나중에 리포트를 읽을 때 판단을 그르친다.
      - name: 상태 DB 구글드라이브에 업로드
        if: success()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db
