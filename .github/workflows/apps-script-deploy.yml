name: Apps Script 배포

# `apps-script/` 아래 두 프로젝트(trading, lxgroup)를 Google Apps Script에
# 올린다. 배포 도구는 clasp이고, 로그인은 주인이 PC에서 한 번 한 뒤 생긴
# `~/.clasprc.json`을 비밀값 CLASPRC_JSON에 넣어 둔 것을 쓴다.
#
# ## 이 워크플로가 하는 일
#
# 1. Node 시험(apps-script/tests)을 먼저 돈다. 떨어지면 올리지 않는다.
# 2. `.clasp.json`의 scriptId가 비어 있는 프로젝트는 건너뛴다(아직 안 만든 것).
# 3. mode가 push면 코드만 올린다. deploy면 판을 만들고 웹 앱 배포를 갱신한다.
#    deployment.json의 deploymentId가 비어 있으면 새 배포를 만들고 ID를
#    로그에 찍는다. 그 값을 파일에 적어 커밋해야 주소가 고정된다.
#
# ## 사람이 한 번 할 것
#
# - https://script.google.com/home/usersettings 에서 Apps Script API 켜기
# - PC에서 `npx @google/clasp login` 후 `.clasprc.json`을 비밀값 CLASPRC_JSON에
# - 첫 배포 뒤 편집기에서 `권한확인` 실행하고 「허용」
#
# 식별자는 영문, 사람이 읽는 name·description·값은 한글이다.
# `${{ github.event.inputs.* }}`는 run: 안에 직접 넣지 않고 env:로 넘긴다.

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-deploy.yml"
  pull_request:
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-deploy.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "올릴 프로젝트"
        type: choice
        options: [all, trading, lxgroup]
        default: all
      mode:
        description: "push는 코드만, deploy는 웹 앱 배포까지"
        type: choice
        options: [push, deploy]
        default: push

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 문법 검사
        working-directory: apps-script
        run: npm run check
      - name: 순수 함수 시험
        working-directory: apps-script
        run: npm test

  deploy:
    needs: test
    # 이 저장소에서만, 그리고 PR에서는 올리지 않는다.
    if: github.repository == 'uTaxx/sdlab_trading' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ github.event.inputs.project || 'all' }}
      MODE: ${{ github.event.inputs.mode || 'push' }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: clasp 로그인 파일 만들기
        # 비밀값이 비어 있으면 여기서 빨갛게 끝낸다. 조용히 넘어가면
        # "올렸는데 안 올라간" 상태가 된다.
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON 비밀값이 비어 있습니다. PC에서 clasp login 뒤 ~/.clasprc.json 내용을 넣으세요."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: 올리기
        run: |
          set -eu
          npm install --no-audit --no-fund -g @google/clasp@3.4.1
          for name in trading lxgroup; do
            if [ "$PROJECT" != "all" ] && [ "$PROJECT" != "$name" ]; then continue; fi
            dir="apps-script/$name"
            script_id=$(node -e "console.log(require('./$dir/.clasp.json').scriptId || '')")
            if [ -z "$script_id" ]; then
              echo "::warning::$name: .clasp.json의 scriptId가 비어 있어 건너뜁니다. 프로젝트를 만든 뒤 ID를 적으세요."
              continue
            fi
            echo "== $name: 코드 올리기 (mode=$MODE)"
            (cd "$dir" && clasp push -f)
            if [ "$MODE" = "deploy" ]; then
              deploy_id=$(node -e "console.log(require('./$dir/deployment.json').deploymentId || '')")
              (cd "$dir" && clasp create-version "배포 ${GITHUB_SHA::7}")
              if [ -z "$deploy_id" ]; then
                echo "== $name: 배포 ID가 없어 새 배포를 만듭니다. 아래 ID를 deployment.json에 적어 커밋하세요."
                (cd "$dir" && clasp create-deployment -d "웹 앱 ${GITHUB_SHA::7}")
              else
                (cd "$dir" && clasp create-deployment -i "$deploy_id" -d "웹 앱 ${GITHUB_SHA::7}")
              fi
            fi
          done

      - name: 로그인 파일 지우기
        if: always()
        run: rm -f "$HOME/.clasprc.json"

      - name: 실패하면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
