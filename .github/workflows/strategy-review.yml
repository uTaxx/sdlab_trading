name: 매일 전략 검토

# 매매 대상 종목의 1주·1개월·3개월 트렌드를 재고, 같은 구간에 등록된 전략을
# 전부 계산해 순위를 낸다. 구간마다 변경 후보를 하나씩 내고 텔레그램에 승인
# 버튼을 붙여 보낸다.
#
# ## 아무것도 바꾸지 않는다
#
# 과거 시세로 계산만 한다. 증권사에 붙지 않고, 주문도 안 나가고, 전략도 안
# 바뀐다. 실제로 바꾸는 것은 strategy-apply.yml이고 그것도 사람이 버튼을 두
# 번 누른 뒤에만 한다.
#
# ## state-write에 묶는다 (2026-09-01에 옮김)
#
# 전에는 읽기만 해서 따로 묶여 있었다. 지금은 그림자 추적이 오늘 순위를
# `strategy_shadows`에 남기고 지평이 지난 옛 줄에 뒤 수익률을 채운다. 그래서
# 상태 DB를 고친다.
#
# 손절 감시를 기다리게 만드는 값이지만 실제로는 겹치지 않는다. 손절 감시는
# 09:00~15:20에만 돌고 이 검토는 17:50이다. 겹칠 일이 없는 대신, 언젠가
# 시각이 바뀌었을 때 DB가 통째로 덮이는 것은 막아 준다.
#
# ## 왜 17:50인가
#
# 17:30 체결 정산 뒤여야 그날 매매가 반영된다. 그 앞에 돌리면 어제까지의
# 상태로 오늘 전략을 판단하게 된다.
#
# ## 실패하면 무엇이 빨개지나
#
# 이 워크플로가 빨개진다. 스크립트가 예외를 잡지 않고 1로 끝낸다. 시트에
# 실패 줄을 남기지 않는 이유는, 검토가 하루 빠지는 것이 매매에 영향을 주지
# 않기 때문이다. 매매는 08:30과 09:05가 따로 돈다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "계산만 한다. 시트에도 안 올리고 알림도 안 보낸다"
        type: boolean
        default: false
      min_hold_days:
        description: "직전 변경 뒤 이만큼 지나기 전에는 후보를 안 낸다 (기본 30)"
        default: "30"
      edge_ratio:
        description: "1위가 지금 전략보다 이 배수만큼 앞서야 후보로 낸다 (기본 1.15)"
        default: "1.15"

concurrency:
  # 상태 DB가 드라이브의 파일 하나라 겹치면 나중 것이 앞 것을 통째로 덮는다.
  # 그림자 추적이 이 DB에 쓴다.
  #
  # cancel-in-progress를 켜면 안 된다. 쓰는 도중에 끊기면 반쯤 고친 DB가
  # 올라간다. 같은 검토가 두 번 겹치면 시트에 줄이 둘 쌓이지만, 그건 열쇠
  # 칸으로 구별할 수 있다.
  group: state-write
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      # 같은 시세를 매일 새로 받으면 야후가 막는다. 검토는 3개월치라 기간
      # 검증(5년)보다 가볍지만, 캐시를 나눠 쓰면 둘 다 덜 받는다.
      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-strategy-review-${{ github.run_id }}
          restore-keys: |
            prices-strategy-review-
            prices-

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 전략 검토
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # **사람이 넣은 값은 명령 줄에 직접 박지 않는다.** `${{ }}`는 셸
          # 스크립트 글자 안으로 그대로 치환되므로, `$(...)`가 섞인 값이 오면
          # 그게 명령으로 실행된다.
          MUWON_DRY_RUN: ${{ github.event.inputs.dry_run }}
          MUWON_MIN_HOLD: ${{ github.event.inputs.min_hold_days || '30' }}
          MUWON_EDGE: ${{ github.event.inputs.edge_ratio || '1.15' }}
        run: |
          # `| tee`는 파이썬의 종료 코드를 삼킨다. 조용히 성공한 척하는
          # 실패가 이 저장소에서 제일 비쌌다.
          set -o pipefail
          # **셸 변수 이름은 영문이어야 한다.** `인자=""`를 쓰면 bash가
          # `command not found`로 죽는다(2026-09-01에 겪음). GitHub Actions
          # 표현식만 그런 줄 알았는데 셸도 같다.
          ARGS=""
          if [ "$MUWON_DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/run_strategy_review.py $ARGS \
            --최소운용일 "$MUWON_MIN_HOLD" --우위배수 "$MUWON_EDGE"

      # **그림자 추적이 상태 DB에 쓴다.** 안 올리면 러너가 사라질 때 오늘
      # 남긴 순위가 통째로 없어지고, 그런데도 텔레그램에는 검토 결과가 뜬다.
      # 조용히 성공한 척하는 실패다.
      #
      # 실패했더라도 올린다. 스크립트가 예외로 끝나면 DB는 안 고쳐진 상태라
      # 올려도 같은 내용이고, 추적을 일부만 잰 경우는 그 표시가 남아야 다음
      # 회차에 같은 것을 다시 재지 않는다.
      - name: 상태 DB 구글드라이브에 올리기
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      # **실패했으면 반드시 알린다.** GitHub 화면의 빨간불을 매일 보는
      # 사람이 없으면 빨간불은 없는 것과 같다. 2026-09-04에 08:30 후보
      # 산출이 죽었는데 주인은 다음 날까지 모르셨다.
      - name: 실패했으면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          what: "17:50 전략 검토"
