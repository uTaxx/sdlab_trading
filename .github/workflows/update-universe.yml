name: 매매 대상 종목 갱신

# 시가총액 상위로 **DB 스냅샷**을 다시 뽑아 쌓는다. 모의투자 엔진과
# 백테스트(`active_universe()`를 부르는 스크립트들)가 이 스냅샷을 읽는다.
#
# **실거래 매수 후보를 뽑는 `propose_buys.py`는 이 스냅샷을 읽지 않는다.**
# 실거래는 구글 시트의 섹터·종목 탭만 읽는다(`sector_sheet.read()`, 지금
# 39종목). 그 목록을 다시 재는 것은 `rescan-sector-universe.yml`이 한다.
#
# ## 2026-09-13에 예약을 껐다
#
# 전에는 이 워크플로도 매주 일요일 밤에 자동으로 돌면서 "매매 대상 종목
# 갱신" 알림을 보냈다. 그런데 위에 적었듯 이 스냅샷은 실거래를 안 바꾼다.
# 매주 오는 알림이 실거래 목록이 바뀐 것처럼 보여서 혼동을 줬다
# (사람이 직접 지적했다). 그래서 자동 실행을 껐다. 모의투자·백테스트용
# 스냅샷을 새로 뽑고 싶을 때는 아래 workflow_dispatch로 손으로 부른다.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "market_cap=실거래가 쓰는 목록 / volume=거래대금 상위(실험용, 실거래 대상은 안 바뀜)"
        type: choice
        options: ["market_cap", "volume"]
        default: "market_cap"
      size:
        description: "유니버스 종목 수"
        default: "30"
      basis:
        description: "volume일 때 줄 세우는 기준"
        type: choice
        options: ["amount", "volume", "surge"]
        default: "amount"
      apply:
        description: "실제로 저장할지 (false면 미리보기만)"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  # 상태 DB를 고치는 워크플로는 전부 이 그룹이다. DB가 구글드라이브의 파일
  # 하나라, 두 실행이 겹치면 나중 것이 앞 것을 통째로 덮는다. 장중 손절
  # 감시(watch-stops)가 5분마다 도는 뒤로 특히 그렇다.
  group: state-write
  cancel-in-progress: false

jobs:
  update:
    # 예약이 없어 어느 저장소에서 손으로 불러도 그대로 된다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: KIS/텔레그램 설정 갱신
        run: |
          python scripts/configure.py kis --env paper \
            --app-key "${{ secrets.KIS_APP_KEY }}" --app-secret "${{ secrets.KIS_APP_SECRET }}" \
            --account-no "${{ secrets.KIS_ACCOUNT_NO }}" --account-product-cd "01"
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 종목 목록 갱신
        run: |
          python scripts/update_universe.py \
            --kind "${{ github.event.inputs.kind || 'market_cap' }}" \
            --basis "${{ github.event.inputs.basis || 'amount' }}" \
            --size "${{ github.event.inputs.size || '30' }}" \
            ${{ github.event.inputs.apply == 'true' && '--apply --notify' || '' }}

      # 갱신에 실패해도(모의투자 미지원 등) 기존 스냅샷은 그대로 남아야 하므로
      # 업로드는 성공했을 때만 한다.
      - name: 상태 DB 구글드라이브에 업로드
        if: success()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

      # **실패했으면 반드시 알린다.** GitHub 화면의 빨간불을 매일 보는
      # 사람이 없으면 빨간불은 없는 것과 같다. 2026-09-04에 08:30 후보
      # 산출이 죽었는데 주인은 다음 날까지 모르셨다.
      - name: 실패했으면 알린다
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          what: "매매 대상 종목 갱신"
